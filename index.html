<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أمانك | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-purple: #6a1b9a;
            --dark-purple: #4a148c;
            --light-purple: #f3e5f5;
            --bg-color: #f8f5fb;
            --white: #ffffff;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; transition: var(--transition); }
        body { background-color: var(--bg-color); color: #333; overflow-x: hidden; }

        /* شاشة الترحيب وتسجيل الدخول */
        #auth-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--white) 0%, var(--light-purple) 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }

        .auth-card {
            background: var(--white);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(106, 27, 154, 0.15);
            width: 90%;
            max-width: 420px;
            text-align: center;
            position: relative;
        }

        .main-logo { width: 140px; margin-bottom: 15px; animation: float 3s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        h2 { color: var(--dark-purple); margin-bottom: 10px; }
        p.subtitle { color: #888; margin-bottom: 25px; font-size: 14px; }

        input, select {
            width: 100%; padding: 14px; margin: 10px 0;
            border: 1px solid #eee; border-radius: 15px;
            background: #fdfbff; font-size: 16px;
        }
        input:focus { border-color: var(--main-purple); outline: none; box-shadow: 0 0 10px rgba(106, 27, 154, 0.1); }

        .btn-primary {
            background: var(--main-purple); color: white; border: none;
            padding: 14px; border-radius: 50px; cursor: pointer;
            width: 100%; font-size: 17px; font-weight: 700; margin-top: 15px;
        }
        .btn-primary:hover { background: var(--dark-purple); transform: scale(1.02); }

        .toggle-link { margin-top: 20px; font-size: 14px; color: var(--main-purple); cursor: pointer; display: block; text-decoration: underline; }

        /* شاشة الموقع الرئيسي (مخفية) */
        #main-app { display: none; opacity: 0; }

        header { 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 15px 5%; box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 1000;
        }
        nav { display: flex; justify-content: space-between; align-items: center; }
        .nav-brand { font-weight: 700; font-size: 22px; color: var(--main-purple); }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin-right: 20px; }
        nav ul li a { text-decoration: none; color: #555; font-weight: 600; cursor: pointer; }
        nav ul li a:hover { color: var(--main-purple); }

        /* محتوى الصفحات */
        .page-content { padding: 40px 5%; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .hero-section { text-align: center; padding: 60px 0; }
        .hero-section h1 { font-size: 32px; color: var(--dark-purple); margin-bottom: 15px; }

        /* لوحة التحكم */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .stat-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; }

        footer { text-align: center; padding: 20px; background: var(--dark-purple); color: white; margin-top: 40px; }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-card" id="login-box">
            <img src="https://i.ibb.co/VWV0pXf/WhatsApp-Image-2026-05-03-at-6-42-03-PM.jpg" alt="Amank" class="main-logo">
            <h2>تسجيل الدخول</h2>
            <p class="subtitle">مرحباً بك مجدداً في منصة أمانك</p>
            <input type="email" placeholder="البريد الجامعي" id="login-email">
            <input type="password" placeholder="كلمة المرور">
            <button class="btn-primary" onclick="accessApp()">دخول</button>
            <span class="toggle-link" onclick="toggleAuth('signup')">ليس لديك حساب؟ إنشاء حساب جديد</span>
        </div>

        <div class="auth-card" id="signup-box" style="display: none;">
            <img src="https://i.ibb.co/VWV0pXf/WhatsApp-Image-2026-05-03-at-6-42-03-PM.jpg" alt="Amank" class="main-logo">
            <h2>إنشاء حساب</h2>
            <p class="subtitle">انضم لبيئتنا الآمنة اليوم</p>
            <input type="text" placeholder="الاسم الكامل">
