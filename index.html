<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amanak Platform | منصة أمانك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-grad: linear-gradient(90deg, #1e3a8a 0%, #a855f7 100%);
            --purple: #a855f7;
            --dark-blue: #1e3a8a;
            --soft-purple: #f3e8ff;
            --bg: #f5f6fa;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; transition: 0.3s; }
        body { background-color: #e9e9f2; padding: 20px; display: flex; justify-content: center; }

        /* الحاوية الرئيسية كأنها تابلت أو متصفح */
        .browser-mockup {
            background: var(--white);
            width: 100%;
            max-width: 1000px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            overflow: hidden;
            min-height: 95vh;
            display: flex;
            flex-direction: column;
        }

        /* القائمة العلوية Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #fff;
            border-bottom: 1px solid #eee;
        }

        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { text-decoration: none; color: #555; font-size: 14px; font-weight: 600; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: var(--purple); }

        .btn-login-top {
            border: 2px solid var(--dark-blue);
            color: var(--dark-blue);
            padding: 5px 20px;
            border-radius: 8px;
            font-weight: 700;
            background: transparent;
            cursor: pointer;
        }

        .brand-logo { font-size: 20px; font-weight: 800; color: var(--dark-blue); display: flex; align-items: center; gap: 5px; }
        .brand-logo span { color: var(--purple); }

        /* المحتوى الرئيسي */
        main { flex: 1; padding: 30px 10%; text-align: center; }

        .hero-logo { width: 140px; margin-bottom: 10px; }
        .hero-title { font-size: 24px; font-weight: 800; margin-bottom: 5px; color: #000; }
        .hero-sub { font-size: 14px; color: #666; margin-bottom: 25px; }

        .hero-actions { display: flex; justify-content: center; gap: 15px; margin-bottom: 35px; }
        .btn-purple { background: var(--purple); color: white; border: none; padding: 10px 30px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-outline { border: 2px solid var(--purple); color: var(--purple); background: white; padding: 10px 25px; border-radius: 10px; font-weight: 700; cursor: pointer; }

        /* الكروت والخدمات */
        .booking-card {
            background: #fff;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: right;
            margin-bottom: 30px;
            border: 1px solid #f0f0f0;
        }

        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 13px; color: #444; font-weight: 600; }
        select, input { padding: 12px; border: 1px solid #ddd; border-radius: 10px; background: #fafafa; }

        .btn-grad {
            background: var(--main-grad);
            color: white; border: none;
            width: 100%; padding: 12px;
            border-radius: 10px; font-weight: 700; font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        /* شبكة الدورات */
        .courses-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .course-card {
            background: #fff; border-radius: 20px; padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: right;
            border: 1px solid #f0f0f0;
        }
        .course-card h3 { font-size: 16px; margin-bottom: 10px; }
        .course-card p { font-size: 13px; color: #777; margin-bottom: 20px; }
        .btn-course { background: var(--main-grad); color: white; border: none; padding: 8px 25px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        footer { text-align: center; padding: 20px; font-size: 12px; color: #999; border-top: 1px solid #eee; }

        /* الأيقونات اليدوية (مثل التي في الصورة) */
        .icon-hand { width: 20px; vertical-align: middle; }
    </style>
</head>
<body>

    <div class="browser-mockup">
        <header>
            <button class="btn-login-top">دخول</button>
            <div class="nav-links">
                <a onclick="showPage('home')" id="nav-home" class="active">الرئيسية</a>
                <a onclick="showPage('booking')">حجز استشارة</a>
                <a onclick="showPage('courses')">الدورات</a>
                <a onclick="showPage('dashboard')">لوحة التحكم</a>
            </div>
            <div class="brand-logo">
                AMANAK ✋
            </div>
        </header>

        <main id="app-content">
            </main>

        <footer>
            مشروع تخرج - منصة أمانك &copy; 2026
        </footer>
    </div>

    <template id="tpl-home">
        <div style="animation: fadeIn 0.5s;">
            <img src="1000643421.jpg" alt="Logo" class="hero-logo">
            <h1 class="hero-title">مرحباً بك في منصة أمانك</h1>
            <p class="hero-sub">بيئة آمنة للاستشارات النفسية والتربوية لطلبة جامعة طيبة.</p>
            
            <div class="hero-actions">
                <button class="btn-purple" onclick="showPage('booking')">ابدأ الآن</button>
                <button class="btn-outline" onclick="showPage('courses')">استكشف الدورات</button>
            </div>

            <div class="booking-card">
                <h2 class="section-title">حجز استشارة جديدة</h2>
                <div class="form-grid">
                    <div class="input-group">
                        <label>نوع الاستشارة</label>
                        <select>
                            <option>Psychological (نفسية)</option>
                            <option>Social (اجتماعية)</option>
                            <option>Educational (تربوية)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>التاريخ والوقت</label>
                        <input type="datetime-local">
                    </div>
                </div>
                <button class="btn-grad" onclick="alert('تم الحجز بنجاح!')">تأكيد الحجز</button>
            </div>

            <h2 class="section-title" style="text-align: right;">الدورات التدريبية المتاحة</h2>
            <div class="courses-grid">
                <div class="course-card">
                    <h3>إدارة الضغوط الجامعية</h3>
                    <p>دورة مكثفة لمساعدة الطلاب على التوازن الدراسي.</p>
                    <button class="btn-course">سجل الآن</button>
                </div>
                <div class="course-card">
                    <h3>مهارات التواصل الفعال</h3>
                    <p>تعلم كيفية بناء علاقات اجتماعية صحية.</p>
                    <button class="btn-course">سجل الآن</button>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-booking">
        <div style="padding: 20px; animation: fadeIn 0.5s;">
            <h2 class="section-title">صفحة حجز المواعيد التفصيلية</h2>
            <div class="booking-card">
                <p>هنا تظهر جميع المواعيد المتاحة للمستشارين...</p>
                </div>
        </div>
    </template>

    <template id="tpl-courses">
        <div style="padding: 20px; animation: fadeIn 0.5s; text-align: right;">
            <h2 class="section-title">جميع الدورات</h2>
            <div class="courses-grid">
                <div class="course-card"><h3>دورة التفكير الإبداعي</h3><p>تطوير مهارات الحلول المبتكرة.</p><button class="btn-course">سجل</button></div>
                <div class="course-card"><h3>الذكاء العاطفي</h3><p>فهم الذات والآخرين بشكل أفضل.</p><button class="btn-course">سجل</button></div>
            </div>
        </div>
    </template>

    <script>
        // دالة التنقل بين الصفحات
        function showPage(pageId) {
            const content = document.getElementById('app-content');
            const template = document.getElementById('tpl-' + pageId);
            
            if (template) {
                content.innerHTML = '';
                content.appendChild(template.content.cloneNode(true));
                
                // تحديث الروابط النشطة
                document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
                // ملاحظة: نحتاج لإضافة ID لكل رابط لتفعيله بدقة
            }
        }

        // تشغيل الصفحة الرئيسية عند فتح الموقع
        window.onload = () => showPage('home');

        // تأثير التلاشي عند الانتقال
        const style = document.createElement('style');
        style.innerHTML = `@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }`;
        document.head.appendChild(style);
    </script>
</body>
</html>
