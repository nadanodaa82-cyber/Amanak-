<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amanak | منصة أمانك</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* تدرج الألوان المأخوذ من شعارك بالضبط */
            --primary-grad: linear-gradient(90deg, #1e3a8a 0%, #a855f7 100%);
            --purple: #a855f7;
            --blue: #1e3a8a;
            --bg: #f3f4f6;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        
        body { background-color: var(--bg); color: #333; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* شاشة تسجيل الدخول */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--white); display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 1; transition: 0.6s;
        }

        .login-card { text-align: center; width: 90%; max-width: 400px; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }

        /* حاوية الموقع الرئيسي */
        #main-app { display: none; width: 100%; max-width: 1100px; margin: 20px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); min-height: 90vh; flex-direction: column; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #eee; }

        nav ul { display: flex; list-style: none; gap: 15px; }
        nav ul li a { text-decoration: none; color: #555; font-weight: 500; cursor: pointer; padding: 8px 15px; border-radius: 10px; transition: 0.3s; }
        nav ul li a.active { color: var(--purple); background: #f3e8ff; }

        .logo-img { width: 120px; cursor: pointer; }

        main { flex: 1; padding: 40px; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn-main { background: var(--primary-grad); color: white; border: none; padding: 12px 30px; border-radius: 50px; cursor: pointer; font-weight: 700; font-size: 16px; }
        .btn-main:hover { transform: scale(1.05); }

        .card { background: white; border: 1px solid #eee; padding: 25px; border-radius: 15px; margin-top: 20px; text-align: right; }

        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; }

        footer { text-align: center; padding: 20px; color: #888; font-size: 13px; border-top: 1px solid #eee; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="login-card">
            <img src="1000643421.jpg" alt="Amanak" style="width: 150px; margin-bottom: 20px;">
            <h2 style="margin-bottom: 20px; color: var(--blue);">تسجيل الدخول</h2>
            <input type="email" placeholder="البريد الجامعي (@taibahu.edu.sa)">
            <input type="password" placeholder="كلمة المرور">
            <button class="btn-main" style="width: 100%;" onclick="login()">دخول للمنصة</button>
        </div>
    </div>

    <div id="main-app">
        <header>
            <button class="btn-main" style="padding: 5px 20px; font-size: 14px;" onclick="location.reload()">خروج</button>
            <nav>
                <ul>
                    <li><a id="nav-home" onclick="showPage('home')" class="active">الرئيسية</a></li>
                    <li><a id="nav-booking" onclick="showPage('booking')">حجز استشارة</a></li>
                    <li><a id="nav-courses" onclick="showPage('courses')">الدورات</a></li>
                    <li><a id="nav-dashboard" onclick="showPage('dashboard')">لوحتي</a></li>
                </ul>
            </nav>
            <img src="1000643421.jpg" alt="Amanak" class="logo-img" onclick="showPage('home')">
        </header>

        <main id="content-area">
            </main>

        <footer>مشروع تخرج - منصة أمانك &copy; 2026</footer>
    </div>

    <template id="tpl-home">
        <div style="text-align: center;">
            <h1 style="color: var(--blue); margin-bottom: 15px;">مرحباً بكِ في Amanak</h1>
            <p style="color: #666; max-width: 600px; margin: 0 auto 30px;">نحن هنا لنقدم لكِ الدعم النفسي والتربوي بكل خصوصية وأمان.</p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="btn-main" onclick="showPage('booking')">ابدأ رحلتك الآن</button>
                <button class="btn-main" style="background: white; color: var(--purple); border: 2px solid var(--purple);" onclick="showPage('courses')">استعراض الدورات</button>
            </div>
            <div class="card" style="margin-top: 40px;">
                <h3>لماذا أمانك؟</h3>
                <p>بيئة آمنة، سرية تامة، ومستشارون معتمدون من جامعة طيبة.</p>
            </div>
        </div>
    </template>

    <template id="tpl-booking">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <h2 style="color: var(--purple); margin-bottom: 20px;">حجز استشارة جديدة</h2>
            <label>نوع الاستشارة</label>
            <select>
                <option>استشارة نفسية</option>
                <option>استشارة اجتماعية</option>
                <option>استشارة تربوية</option>
            </select>
            <label>التاريخ والوقت</label>
            <input type="datetime-local">
            <button class="btn-main" style="width: 100%; margin-top: 20px;" onclick="alert('تم حجز موعدك! سيتم التواصل معك عبر البريد.')">تأكيد الحجز</button>
        </div>
    </template>

    <template id="tpl-courses">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
            <div class="card">
                <h3 style="color: var(--blue);">الذكاء العاطفي</h3>
                <p style="color: #777; margin: 10px 0;">دورة متخصصة في فهم المشاعر وإدارتها.</p>
                <button class="btn-main" style="padding: 8px 20px; font-size: 14px;">سجل الآن</button>
            </div>
            <div class="card">
                <h3 style="color: var(--blue);">إدارة الوقت</h3>
                <p style="color: #777; margin: 10px 0;">كيفية تنظيم يومك الدراسي بنجاح.</p>
                <button class="btn-main" style="padding: 8px 20px; font-size: 14px;">سجل الآن</button>
            </div>
        </div>
    </template>

    <template id="tpl-dashboard">
        <div class="card">
            <h2 style="margin-bottom: 15px;">لوحة التحكم الخاصة بكِ</h2>
            <div style="border-right: 4px solid var(--purple); padding-right: 15px;">
                <p><strong>الاسم:</strong> طالبة جامعة طيبة</p>
                <p><strong>البريد:</strong> student@taibahu.edu.sa</p>
                <p><strong>المواعيد القادمة:</strong> لا يوجد حالياً</p>
            </div>
        </div>
    </template>

    <script>
        // دالة الدخول (تخفي شاشة الدخول وتظهر الموقع)
        function login() {
            const auth = document.getElementById('auth-screen');
            const app = document.getElementById('main-app');
            
            auth.style.opacity = '0';
            setTimeout(() => {
                auth.style.display = 'none';
                app.style.display = 'flex';
                setTimeout(() => { app.style.opacity = '1'; }, 50);
                showPage('home'); // تحميل الصفحة الرئيسية فور الدخول
            }, 600);
        }

        // دالة التنقل بين الصفحات
        function showPage(pageId) {
            const contentArea = document.getElementById('content-area');
            const template = document.getElementById('tpl-' + pageId);
            
            if (template) {
                contentArea.innerHTML = '';
                contentArea.appendChild(template.content.cloneNode(true));
                
                // تحديث القائمة العلوية لتعرفي في أي صفحة أنتِ
                document.querySelectorAll('nav ul li a').forEach(a => a.classList.remove('active'));
                const activeNav = document.getElementById('nav-' + pageId);
                if(activeNav) activeNav.classList.add('active');
            }
        }
    </script>
</body>
</html>
