<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amanak | منصة أمانك</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* درجات الألوان من شعار أمانك بالضبط */
            --main-grad: linear-gradient(90deg, #1e3a8a 0%, #a855f7 100%);
            --purple: #a855f7;
            --blue: #1e3a8a;
            --bg-light: #f4f6fb;
            --white: #ffffff;
            --card-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        
        body { 
            background-color: var(--bg-light); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }

        /* الحاوية الرئيسية (نفس شكل الصورة) */
        .main-wrapper {
            background: var(--white);
            width: 100%;
            max-width: 1050px;
            min-height: 90vh;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* الهيدر العلوي */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
        }

        .nav-menu { display: flex; gap: 15px; align-items: center; }
        .nav-menu a { 
            text-decoration: none; 
            color: #555; 
            font-weight: 600; 
            font-size: 14px; 
            padding: 8px 16px; 
            border-radius: 12px; 
            cursor: pointer;
            transition: 0.3s;
        }
        .nav-menu a.active { color: var(--purple); background: #f3e8ff; }
        .nav-menu a:hover:not(.active) { color: var(--blue); background: #f0f4ff; }

        .btn-login-outline {
            border: 2px solid var(--blue);
            color: var(--blue);
            background: transparent;
            padding: 6px 22px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-login-outline:hover { background: var(--blue); color: white; }

        .brand { font-size: 22px; font-weight: 800; color: var(--blue); display: flex; align-items: center; gap: 8px; }
        .brand span { color: var(--purple); }

        /* منطقة المحتوى */
        main { flex: 1; padding: 40px 10%; text-align: center; }

        .hero-img { width: 160px; margin-bottom: 15px; }
        .hero-text h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; color: #111; }
        .hero-text p { color: #666; font-size: 15px; margin-bottom: 30px; }

        /* الأزرار التفاعلية */
        .actions-row { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; }
        .btn-p { background: var(--purple); color: white; border: none; padding: 12px 35px; border-radius: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.2); }
        .btn-o { background: white; color: var(--purple); border: 2px solid var(--purple); padding: 12px 30px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .btn-p:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(168, 85, 247, 0.3); }

        /* كروت الخدمات */
        .section-card {
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid #f0f0f0;
