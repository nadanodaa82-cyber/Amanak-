<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أمانك 🤝</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --grad: linear-gradient(90deg, #a855f7 0%, #ec4899 100%);
            --blue: #1e3a8a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: #f1f5f9; min-height: 100vh; display: flex; justify-content: center; align-items: center; }

        /* شاشة تسجيل الدخول */
        #login-screen {
            background: white; padding: 40px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 90%; max-width: 400px; text-align: center; position: absolute; z-index: 99;
        }

        /* المنصة (مخفية في البداية) */
        #app-screen {
            display: none; width: 100%; max-width: 1000px; min-height: 90vh; background: white;
            border-radius: 30px; flex-direction: column; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.1);
        }

        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; border-bottom: 1px solid #eee; }
        .brand { font-size: 24px; font-weight: 900; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .nav-btn { background: none; border: none; padding: 10px 15px; cursor: pointer; font-weight: 700; color: #64748b; }
        .nav-btn.active { color: #a855f7; background: #f5f3ff; border-radius: 12px; }

        main { padding: 30px; text-align: center; flex: 1; }
        .content-section { display: none; animation: fadeIn 0.4s ease; }
        .content-section.active { display: block; }

        .btn-action { background: var(--grad); color: white; border: none; width: 100%; padding: 15px; border-radius: 15px; font-weight: 800; cursor: pointer; margin-top: 20px; box-shadow: 0 10px 20px rgba(236, 72, 153, 0.2); }
        .card { background: #fff; border: 1px solid #f1f5f9; padding: 20px; border-radius: 20px; text-align: right; margin-top: 20px; }
        
        .c-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .c-item { padding: 20px; border-radius: 15px; color: white; cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <img src="1000643421.jpg" style="width: 120px; margin-bottom: 20px;" onerror="this.src='https://via.placeholder.com/120'">
        <h2 style="color: var(--blue); margin-bottom: 20px;">تسجيل الدخول</h2>
        <input type="text" placeholder="البريد الجامعي" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:10px;">
        <input type="password" placeholder="كلمة المرور" style="width:100%; padding:12px; margin-bottom:20px; border:1px solid #ddd; border-radius:10px;">
        <button class="btn-action" onclick="enterApp()">دخول للمنصة 🤝</button>
    </div>

    <div id="app-screen">
        <header>
            <button onclick="location.reload()" style="color:red; border:none; background:none; cursor:pointer;">خروج</button>
            <nav>
                <button class="nav-btn active" id="b-home" onclick="tab('home')">الرئيسية</button>
                <button class="nav-btn" id="b-book" onclick="tab('book')">الاستشارات</button>
                <button class="nav-btn" id="b-course" onclick="tab('course')">الدورات</button>
            </nav>
            <div class="brand">Amanak 🤝</div>
        </header>

        <main>
            <div id="home" class="content-section active">
                <img src="1000643421.jpg" style="width: 130px; margin-bottom: 10px;">
                <h1 style="color: var(--blue);">مرحباً بكِ في أمانك الجامعية</h1>
                <div class="c-grid">
                    <div class="c-item" style="background:#6366f1" onclick="tab('book')"><i class="fas fa-brain"></i><h3>نفسية</h3></div>
                    <div class="c-item" style="background:#a855f7" onclick="tab('book')"><i class="fas fa-graduation-cap"></i><h3>تربوية</h3></div>
                    <div class="c-item" style="background:#ec4899" onclick="tab('book')"><i class="fas fa-users"></i><h3>اجتماعية</h3></div>
                </div>
            </div>

            <div id="book" class="content-section">
                <div class="card">
                    <h2>طلب استشارة جديد ✍️</h2>
                    <select style="width:100%; padding:12px; margin:10px 0; border-radius:10px;"><option>نفسية</option><option>تربوية</option><option>اجتماعية</option></select>
                    <input type="datetime-local" style="width:100%; padding:12px; margin:10px 0; border-radius:10px;">
                    <textarea style="width:100%; height:100px; padding:10px; margin-top:10px; border-radius:10px;" placeholder="اكتبي ملاحظاتك هنا..."></textarea>
                    <button class="btn-action" onclick="alert('تم حجز موعدك بنجاح 🤝')">تأكيد الموعد</button>
                </div>
            </div>

            <div id="course" class="content-section">
                <h2 style="text-align: right;">الدورات المتاحة ⭐</h2>
                <div class="card"><h3>إدارة الضغوط الجامعية</h3><button class="btn-action" style="width:auto; padding:8px 20px;">سجل</button></div>
                <div class="card"><h3>مهارات الثقة بالنفس</h3><button class="btn-action" style="width:auto; padding:8px 20px;">سجل</button></div>
            </div>
        </main>
        <footer style="text-align:center; padding:15px; color:#aaa; font-size:12px;">مشروع تخرج منصة أمانك 2026</footer>
    </div>

    <script>
        // دالة الدخول (تم تبسيطها لأقصى درجة)
        function enterApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
        }

        // دالة التنقل
        function tab(name) {
            var pages = document.getElementsByClassName('content-section');
            for(var i=0; i<pages.length; i++) { pages[i].style.display = 'none'; }
            document.getElementById(name).style.display = 'block';

            var btns = document.getElementsByClassName('nav-btn');
            for(var i=0; i<btns.length; i++) { btns[i].classList.remove('active'); }
            document.getElementById('b-' + name).classList.add('active');
        }
    </script>
</body>
</html>
