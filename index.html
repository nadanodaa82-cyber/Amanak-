<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أمانك | Amank</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* المتغيرات الأساسية */
        :root {
            --main-purple: #6a1b9a;
            --dark-purple: #4a148c;
            --light-purple: #f3e5f5;
            --bg-color: #f8f5fb;
            --white: #ffffff;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; transition: var(--transition); }
        
        body { background-color: var(--bg-color); color: #333; overflow-x: hidden; }

        /* شريط التنقل */
        header { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px);
            padding: 15px 5%; 
            box-shadow: 0 2px 15px rgba(106, 27, 154, 0.1); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }
        nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; font-size: 24px; color: var(--main-purple); letter-spacing: 1px; }
        
        nav ul { display: flex; list-style: none; align-items: center; }
        nav ul li { margin-right: 25px; cursor: pointer; font-weight: 600; position: relative; }
        
        nav ul li a { text-decoration: none; color: #555; }
        nav ul li a:hover { color: var(--main-purple); }
        
        /* حركة الخط تحت الروابط */
        nav ul li a::after {
            content: ''; position: absolute; width: 0; height: 2px; bottom: -5px; right: 0;
            background: var(--main-purple); transition: var(--transition);
        }
        nav ul li a:hover::after { width: 100%; }

        .btn-login a { 
            background: var(--main-purple); color: #fff !important; 
            padding: 10px 25px; border-radius: 25px; 
        }
        .btn-login a:hover { background: var(--dark-purple); transform: scale(1.05); }

        /* المحتوى الرئيسي */
        main { min-height: 80vh; transition: opacity 0.4s ease-in-out; }

        /* الصفحة الرئيسية */
        .hero { padding: 80px 5%; text-align: center; background: radial-gradient(circle at top, #fff 0%, var(--light-purple) 100%); }
        .main-logo { width: 220px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1)); animation: float 3s ease-in-out infinite; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .hero h1 { font-size: 2.5rem; margin-top: 20px; color: var(--dark-purple); }
        .hero p { font-size: 1.2rem; color: #666; margin-bottom: 30px; }

        /* الأزرار */
        .btn-primary { 
            background: var(--main-purple); color: #fff; border: none; padding: 14px 40px; 
            border-radius: 50px; cursor: pointer; font-size: 17px; font-weight: 600;
            box-shadow: 0 4px 15px rgba(106, 27, 154, 0.3);
        }
        .btn-primary:hover { background: var(--dark-purple); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(106, 27, 154, 0.4); }

        .btn-secondary { 
            border: 2px solid var(--main-purple); color: var(--main-purple); background: transparent; 
            padding: 12px 35px; border-radius: 50px; cursor: pointer; font-weight: 600;
        }
        .btn-secondary:hover { background: var(--light-purple); transform: translateY(-3px); }

        /* البطاقات */
        .page-container { padding: 60px 5%; animation: slideUp 0.6s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .grid-layout, .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 40px; }
        
        .card, .stat-card { 
            background: var(--white); padding: 35px; border-radius: 25px; 
            border-bottom: 5px solid var(--main-purple); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); cursor: pointer;
        }
        .card:hover, .stat-card:hover { transform: translateY(-12px); box-shadow: 0 15px 30px rgba(106, 27, 154, 0.15); }

        /* النوافذ المنبثقة */
        .modal { 
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); 
        }
        .modal-content { 
            background: var(--white); margin: 10% auto; padding: 40px; width: 90%; max-width: 400px; 
            border-radius: 30px; text-align: center; position: relative;
            animation: modalShow 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        @keyframes modalShow { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        
        .close { position: absolute; left: 20px; top: 15px; font-size: 28px; cursor: pointer; color: #999; }
        .close:hover { color: var(--main-purple); }

        input, select { 
            width: 100%; padding: 12px 15px; margin: 12px 0; border: 1px solid #eee; 
            border-radius: 12px; background: #fdfbff; font-size: 16px;
        }
        input:focus { border-color: var(--main-purple); outline: none; box-shadow: 0 0 8px rgba(106, 27, 154, 0.1); }

        footer { background: var(--dark-purple); color: #fff; text-align: center; padding: 25px; margin-top: 50px; }

    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">AMANK</div>
            <ul id="nav-links">
                <li><a onclick="showPage('home')">الرئيسية</a></li>
                <li><a onclick="showPage('booking')">حجز استشارة</a></li>
                <li><a onclick="showPage('courses')">الدورات</a></li>
                <li><a onclick="showPage('dashboard')">لوحة التحكم</a></li>
                <li class="btn-login"><a onclick="openModal('loginModal')">دخول</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        </main>

    <template id="page-home">
        <section class="hero">
            <img src="https://i.ibb.co/VWV0pXf/WhatsApp-Image-2026-05-03-at-6-42-03-PM.jpg" alt="Amank Logo" class="main-logo">
            <h1>مرحباً بك في منصة أمانك</h1>
            <p>المساحة الآمنة لدعمك النفسي والتربوي بجامعة طيبة.</p>
            <div class="hero-btns">
                <button class="btn-primary" onclick="showPage('booking')">ابدأ الآن</button>
                <button class="btn-secondary" onclick="showPage('courses')">استكشف الدورات</button>
            </div>
        </section>
    </template>

    <template id="page-booking">
        <section class="page-container">
            <h2>حجز استشارة جديدة</h2>
            <div class="form-box" style="max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
                <label>نوع الاستشارة</label>
                <select>
                    <option>نفسية</option>
                    <option>اجتماعية</option>
                    <option>تربوية</option>
                    <option>دينية</option>
                </select>
                <label>اختر الموعد المناسب</label>
                <input type="datetime-local">
                <button class="btn-primary" style="width: 100%; margin: 20px 0 0 0;" onclick="alert('تم حجز موعدك بنجاح! سيتم التواصل معك قريباً.')">تأكيد الحجز</button>
            </div>
        </section>
    </template>

    <template id="page-courses">
        <section class="page-container">
            <h2>الدورات التدريبية المتاحة</h2>
            <div class="grid-layout">
                <div class="card">
                    <h3>إدارة الضغوط الجامعية</h3>
                    <p>استراتيجيات عملية للتعامل مع ضغط الاختبارات.</p>
                    <button class="btn-secondary" style="margin-top: 15px;">سجل الآن</button>
                </div>
                <div class="card">
                    <h3>مهارات الثقة بالنفس</h3>
                    <p>بناء شخصية قوية وقادرة على المواجهة الاجتماعية.</p>
                    <button class="btn-secondary" style="margin-top: 15px;">سجل الآن</button>
                </div>
                <div class="card">
                    <h3>الذكاء العاطفي</h3>
                    <p>كيف تفهم مشاعرك وتدير علاقاتك بذكاء.</p>
                    <button class="btn-secondary" style="margin-top: 15px;">سجل الآن</button>
                </div>
            </div>
        </section>
    </template>

    <template id="page-dashboard">
        <section class="page-container">
            <h2>لوحة تحكم الطالب</h2>
            <div class="dashboard-grid">
                <div class="stat-card">
                    <h3>مواعيدي</h3>
                    <p style="color: #888;">لا توجد مواعيد قادمة</p>
                </div>
                <div class="stat-card" onclick="openModal('reportModal')">
                    <h3 style="color: var(--main-purple);">التقرير النفسي</h3>
                    <p>حالتك مستقرة (ممتاز) ✨</p>
                    <small>اضغط لعرض التفاصيل</small>
                </div>
            </div>
        </section>
    </template>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('loginModal')">&times;</span>
            <h2 style="margin-bottom: 20px;">تسجيل الدخول</h2>
            <input type="email" placeholder="البريد الجامعي">
            <input type="password" placeholder="كلمة المرور">
            <button class="btn-primary" style="width: 100%;">دخول</button>
        </div>
    </div>

    <div id="reportModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('reportModal')">&times;</span>
            <h2 style="color: var(--main-purple); margin-bottom: 15px;">تقريرك النفسي</h2>
            <div style="text-align: right; margin-bottom: 20px; font-size: 15px;">
                <p>✅ التفاعل مع الدورات: 100%</p>
                <p>✅ الالتزام بالمواعيد: ممتاز</p>
                <p>✅ الحالة العامة: مستقرة جداً</p>
            </div>
            <button class="btn-primary" onclick="window.print()">تحميل كـ PDF</button>
        </div>
    </div>

    <footer>
        <p>مشروع تخرج - منصة أمانك &copy; 2026</p>
    </footer>

    <script>
        function showPage(pageId) {
            const mainContent = document.getElementById('main-content');
            const template = document.getElementById('page-' + pageId);
            
            // حركة اختفاء ناعمة قبل تغيير المحتوى
            mainContent.style.opacity = '0';
            
            setTimeout(() => {
                mainContent.innerHTML = '';
                mainContent.appendChild(template.content.cloneNode(true));
                mainContent.style.opacity = '1';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 300);

            // إغلاق أي نافذة مفتوحة
            const modals = document.querySelectorAll('.modal');
            modals.forEach(m => m.style.display = 'none');
        }

        function openModal(id) {
            document.getElementById(id).style.display = "block";
        }

        function closeModal(id) {
            document.getElementById(id).style.display = "none";
        }

        // إغلاق النافذة عند الضغط خارجها
        window.onclick = function(event) {
            if (event.target.className === 'modal') {
                event.target.style.display = "none";
            }
        }

        window.onload = () => showPage('home');
    </script>
</body>
</html>
