<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أمانك | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-purple: #6a1b9a;
            --dark-purple: #4a148c;
            --light-purple: #f3e5f5;
            --bg-color: #f8f5fb;
            --white: #ffffff;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body { background-color: var(--bg-color); color: #333; overflow-x: hidden; }

        /* شاشة تسجيل الدخول الكاملة */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, var(--white) 0%, var(--light-purple) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: transform 0.8s ease-in-out;
        }

        .login-card {
            background: var(--white);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(106, 27, 154, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        /* شاشة الموقع الرئيسية (مخفية في البداية) */
        #main-app { display: none; opacity: 0; transition: opacity 0.5s ease; }

        header { 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 15px 5%; box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 1000;
        }

        nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; font-size: 22px; color: var(--main-purple); }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin-right: 20px; cursor: pointer; font-weight: 600; }
        nav ul li a { text-decoration: none; color: #555; font-size: 14px; }

        .main-logo { width: 150px; margin-bottom: 20px; animation: float 3s infinite; }
        
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        input {
            width: 100%; padding: 14px; margin: 10px 0;
            border: 1px solid #eee; border-radius: 15px;
            background: #fdfbff; font-size: 16px; transition: var(--transition);
        }
        input:focus { border-color: var(--main-purple); outline: none; }

        .btn-primary {
            background: var(--main-purple); color: white; border: none;
            padding: 14px 30px; border-radius: 50px; cursor: pointer;
            width: 100%; font-size: 17px; font-weight: 600; margin-top: 10px;
            box-shadow: 0 5px 15px rgba(106, 27, 154, 0.2);
        }
        .btn-primary:hover { background: var(--dark-purple); transform: scale(1.02); }

        /* تنسيق الأقسام */
        .hero { padding: 60px 5%; text-align: center; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 40px 5%; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

    </style>
</head>
