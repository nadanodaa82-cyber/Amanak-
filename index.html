<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amanak Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-grad: linear-gradient(90deg, #1e3a8a 0%, #a855f7 100%);
            --purple: #a855f7;
            --blue: #1e3a8a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* شاشة تسجيل الدخول */
        #login-page {
            background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%; max-width: 400px; text-align: center; display: block; /* ظاهرة في البداية */
        }

        /* حاوية المنصة الرئيسية */
        #main-platform {
            display: none; /* مخفية في البداية */
            background: white; width: 100%; max-width: 1000px; min-height: 90vh;
            border-radius: 25px; box-shadow: 0 15px 50px rgba(0,0,0,0.1);
            flex-direction: column; overflow: hidden;
        }

        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; border-bottom: 1px solid #eee; }
        .nav-links { display: flex; gap: 10px; }
        .nav-links button { background: none; border: none; padding: 10px; cursor: pointer; font-weight: 700; color: #555; }
        .nav-links button.active { color: var(--purple); background: #f3e8ff; border-radius: 10px; }

        main { padding: 30px; text-align: center; flex: 1; }
        .page-content { display: none; }
        .page-content.active { display: block; }

        .btn-p { background: var(--purple); color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: 700; margin: 5px; }
        .btn-grad { background: var(--main-grad); color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: 800; margin-top: 20px; }
        
        .card { background: #fff; border: 1px solid #eee; padding: 20px; border-radius: 15px; text-align: right; margin-top: 20px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; }
        
        .consult-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .c-box { padding: 20px; border-radius: 15px; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-page">
        <img src="1000643421.jpg" style="width: 120px; margin-bottom: 20px;" onerror="this.src='https://via.placeholder.com/120'">
        <h2 style="color: var(--blue); margin-bottom: 20px;">تسجيل الدخول</h2>
        <input type="text" placeholder="البريد الجامعي">
        <input type="password" placeholder="كلمة المرور">
        <button class="btn-grad" onclick="startApp()">دخول للمنصة</button>
    </div>

    <div id="main-platform">
        <header>
            <button onclick="location.reload()" style="border:1px solid red; color:red; padding:5px 10px; border-radius:5px; background:none; cursor:pointer;">خروج</button>
            <nav class="nav-links">
                <button onclick="goTo('home')" id="tab-home" class="active">الرئيسية</button>
                <button onclick="goTo('booking')" id="tab-booking">حجز استشارة</button>
                <button onclick="goTo('courses')" id="tab-courses">الدورات</button>
            </nav>
            <div style="font-weight: 800; color: var(--blue);">AMANAK ✋</div>
        </header>

        <main>
            <div id="home" class="page-content active">
                <img src="1000643421.jpg" style="width: 130px; margin-bottom: 10px;">
                <h1>مرحباً بكِ في أمانك</h1>
                <p style="color: #666; margin-bottom: 20px;">بيئة آمنة للاستشارات النفسية والتربوية بجامعة طيبة.</p>
                
                <div class="consult-grid">
                    <div class="c-box" style="background:#6366f1" onclick="goTo('booking')"><h3>نفسية</h3><p>دعم وتوجيه نفسي</p></div>
                    <div class="c-box" style="background:#a855f7" onclick="goTo('booking')"><h3>تربوية</h3><p>تطوير المهارات</p></div>
                    <div class="c-box" style="background:#3b82f6" onclick="goTo('booking')"><h3>اجتماعية</h3><p>استشارات أسرية</p></div>
                </div>
            </div>

            <div id="booking" class="page-content">
                <div class="card">
                    <h2>طلب استشارة جديد</h2>
                    <select><option>استشارة نفسية</option><option>استشارة تربوية</option></select>
                    <input type="datetime-local">
                    <textarea placeholder="سبب الاستشارة..."></textarea>
                    <button class="btn-grad" onclick="alert('تم الحجز بنجاح!')">تأكيد الحجز</button>
                </div>
            </div>

            <div id="courses" class="page-content">
                <h2 style="text-align: right;">الدورات التدريبية</h2>
                <div class="card"><h3>إدارة الضغوط</h3><button class="btn-p">سجل الآن</button></div>
                <div class="card"><h3>الثقة بالنفس</h3><button class="btn-p">سجل الآن</button></div>
            </div>
        </main>
    </div>

    <script>
        // دالة الدخول (أهم دالة)
        function startApp() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-platform').style.display = 'flex';
        }

        // دالة التنقل
        function goTo(id) {
            // إخفاء الصفحات
            var pages = document.getElementsByClassName('page-content');
            for(var i=0; i<pages.length; i++) { pages[i].classList.remove('active'); }
            
            // إظهار الصفحة
            document.getElementById(id).classList.add('active');

            // تحديث الزراير
            var buttons = document.querySelectorAll('.nav-links button');
            buttons.forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
        }
    </script>
</body>
</html>
