<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amanak Platform | منصة أمانك 🤝</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --purple-main: #6d28d9; 
            --blue-cyan: #25aae1;
            --gradient-blue: linear-gradient(90deg, #25aae1 0%, #a855f7 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; transition: 0.3s; }
        body { background-color: #f1f0f7; color: #1e1b4b; line-height: 1.6; }

        /* الهيدر (مطابق للصورة) */
        header {
            background: white; padding: 15px 8%; display: flex; justify-content: space-between;
            align-items: center; border-radius: 0 0 25px 25px; box-shadow: 0 8px 30px rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 1000;
        }
        .nav-menu { display: flex; gap: 20px; align-items: center; }
        .nav-menu a { text-decoration: none; color: #1e1b4b; font-weight: 700; font-size: 14px; cursor: pointer; }
        .login-btn-top { border: 2px solid var(--blue-cyan); padding: 6px 22px; border-radius: 12px; font-weight: 900; background: none; cursor: pointer; }

        /* المحتوى الرئيسي */
        main { padding: 40px 8%; max-width: 1100px; margin: 0 auto; text-align: center; }
        .hero-logo i { font-size: 80px; background: var(--gradient-blue); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-logo h2 { font-size: 45px; font-weight: 900; color: var(--purple-main); margin: 10px 0; }
        .eng-name { color: #a74eb5; font-weight: bold; margin-top: -10px; }

        .hero-text h1 { font-size: 36px; font-weight: 900; color: #111; margin-top: 20px; }
        .hero-text p { color: #666; font-size: 17px; margin: 15px 0 30px; }

        .action-btns { display: flex; justify-content: center; gap: 15px; margin: 30px 0; }
        .btn-purple-solid { background: var(--purple-main); color: white; border: none; padding: 12px 40px; border-radius: 15px; font-weight: 800; cursor: pointer; }
        .btn-purple-outline { border: 2px solid var(--purple-main); color: var(--purple-main); background: white; padding: 12px 40px; border-radius: 15px; font-weight: 800; cursor: pointer; }

        /* كرت الحجز (مطابق للصورة) */
        .section-box { background: white; border-radius: 35px; padding: 40px; text-align: right; box-shadow: 0 20px 60px rgba(0,0,0,0.03); margin: 40px 0; }
        .section-title { font-size: 22px; font-weight: 900; margin-bottom: 25px; border-right: 5px solid var(--purple-main); padding-right: 15px; display: block; }

        .booking-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        input, select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #ddd; background: #fafafa; outline: none; }
        
        .confirm-btn { 
            grid-column: span 2; background: var(--gradient-blue); color: white; border: none; 
            padding: 18px; border-radius: 15px; font-weight: 900; font-size: 18px; cursor: pointer;
        }

        /* التحكم بالصفحات */
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        footer { text-align: center; padding: 30px; color: #888; border-top: 1px solid #eee; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <button class="login-btn-top" onclick="alert('سجل دخولك أولاً 🤝')">دخول</button>
        <nav class="nav-menu">
            <a onclick="showTab('home')">الرئيسية</a>
            <a onclick="showTab('booking')">حجز استشارة</a>
            <a onclick="showTab('courses')">الدورات</a>
            <a onclick="showTab('home')">لوحة التحكم</a>
        </nav>
        <div style="font-weight:900; color:var(--purple-main); font-size:24px; cursor:pointer;" onclick="showTab('home')">Amanak 🤝</div>
    </header>

    <main>
        <div id="home" class="page active">
            <section class="hero-logo">
                <i class="fas fa-hands-helping"></i> <h2>أمانك</h2>
                <p class="eng-name">AMANAK</p>
                <div class="hero-text">
                    <h1>مرحباً بكِ في منصة أمانك</h1>
                    <p>بيئة آمنة للاستشارات النفسية والتربوية لطلبة جامعة طيبة.</p>
                </div>
                <div class="action-btns">
                    <button class="btn-purple-solid" onclick="showTab('booking')">ابدأ الآن</button>
                    <button class="btn-purple-outline" onclick="showTab('courses')">استكشف الدورات</button>
                </div>
            </section>
        </div>

        <div id="booking" class="page">
            <div class="section-box">
                <span class="section-title">حجز استشارة جديدة</span>
                <div class="booking-grid">
                    <div><label>نوع الاستشارة لطلبة اجتماعي</label><select><option>استشارة فردية</option><option>جلسة جماعية</option></select></div>
                    <div><label>نوع الاستشارة</label><select><option>Psychological</option><option>Social</option></select></div>
                    <button class="confirm-btn" onclick="alert('تم الحجز بنجاح! 🤝')">تأكيد الحجز</button>
                </div>
            </div>
        </div>

        <div id="courses" class="page">
            <div class="section-box">
                <span class="section-title">الدورات التدريبية</span>
                <div class="booking-grid">
                    <div style="background:#f3f4f6; padding:20px; border-radius:20px; text-align:center;">
                        <h3>دورة الصحة النفسية</h3>
                        <button class="btn-purple-solid" style="margin-top:10px" onclick="alert('تم التسجيل! 🎓')">سجل الآن</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        مشروع تخرج - منصة أمانك © 2026 جامعة طيبة 🤝
    </footer>

    <script>
        // دالة تشغيل كل الأزرار والتنقل بين الصفحات
        function showTab(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
