<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amanak | منصة أمانك 🤝</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --purple-main: #6d28d9; 
            --blue-cyan: #25aae1;
            --gradient-blue: linear-gradient(90deg, #25aae1 0%, #a855f7 100%);
            --text-dark: #1e1b4b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; transition: 0.3s; }
        body { background-color: #f1f0f7; color: var(--text-dark); }

        /* الهيدر الأبيض النظيف */
        header {
            background: white; padding: 15px 8%; display: flex; justify-content: space-between;
            align-items: center; border-radius: 0 0 25px 25px; box-shadow: 0 8px 30px rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 1000;
        }
        .nav-menu { display: flex; gap: 20px; align-items: center; }
        .nav-menu a { text-decoration: none; color: var(--text-dark); font-weight: 700; font-size: 14px; cursor: pointer; }
        .login-btn-top { border: 2px solid var(--blue-cyan); color: var(--text-dark); background: none; padding: 6px 22px; border-radius: 12px; font-weight: 900; cursor: pointer; }

        /* المحتوى المركزي */
        main { padding: 40px 8%; max-width: 1100px; margin: 0 auto; text-align: center; }
        .hero-logo i { font-size: 80px; background: var(--gradient-blue); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-logo h2 { font-size: 45px; font-weight: 900; color: var(--purple-main); margin: 10px 0; }
        .hero-logo p.eng-name { color: #a74eb5; font-weight: bold; margin-top: -10px; letter-spacing: 2px; }

        .hero-text h1 { font-size: 36px; font-weight: 900; color: #111; margin-top: 20px; }
        .hero-text p { color: #666; font-size: 17px; margin: 15px 0 30px; }

        .btn-purple-solid { background: var(--purple-main); color: white; border: none; padding: 12px 40px; border-radius: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(109, 40, 217, 0.2); }
        .btn-purple-outline { border: 2px solid var(--purple-main); color: var(--purple-main); background: white; padding: 12px 40px; border-radius: 15px; font-weight: 800; cursor: pointer; margin-right: 10px; }

        /* كرت حجز الاستشارة (المطابق للصورة) */
        .section-box { background: white; border-radius: 35px; padding: 40px; text-align: right; box-shadow: 0 20px 60px rgba(0,0,0,0.03); margin: 40px 0; }
        .section-title { font-size: 22px; font-weight: 900; margin-bottom: 25px; border-right: 5px solid var(--purple-main); padding-right: 15px; display: block; }

        .booking-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; }
        input, select { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #ddd; outline: none; background: #fafafa; }
        
        .confirm-btn { 
            grid-column: span 2; background: var(--gradient-blue); color: white; border: none; 
            padding: 18px; border-radius: 15px; font-weight: 900; font-size: 18px; cursor: pointer; margin-top: 20px;
        }

        /* الصفحات */
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        footer { text-align: center; padding: 30px; color: #888; font-size: 13px; border-top: 1px solid #eee; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <button class="login-btn-top" onclick="alert('شاشة الدخول مفعلة 🤝')">دخول</button>
        <nav class="nav-menu">
            <a onclick="showTab('home')">الرئيسية</a>
            <a onclick="showTab('booking')">حجز استشارة</a>
            <a onclick="showTab('courses')">الدورات</a>
            <a onclick="showTab('home')">لوحة التحكم</a>
        </nav>
        <div style="font-weight:900; color:var(--purple-main); font-size:24px; cursor:pointer;" onclick="showTab('home')">Amanak 🤝</div>
    </header>

    <main>
        <div id="home" class="page active">
            <section class="hero-logo">
                <i class="fas fa-hands-helping"></i>
                <h2>أمانك</h2>
                <p class="eng-name">AMANAK</p>
                <div class="hero-text">
                    <h1>مرحباً بكِ في منصة أمانك</h1>
                    <p>بيئة آمنة للاستشارات النفسية والتربوية لطلبة جامعة طيبة.</p>
                </div>
                <div class="action-btns">
                    <button class="btn-purple-solid" onclick="showTab('booking')">ابدأ الآن</button>
                    <button class="btn-purple-outline" onclick="showTab('courses')">استكشف الدورات</button>
                </div>
            </section>
        </div>

        <div id="booking" class="page">
            <div class="section-box">
                <span class="section-title">حجز استشارة جديدة</span>
                <div class="booking-grid">
                    <div class="input-group">
                        <label>نوع الاستشارة لطلبة اجتماعي</label>
                        <select><option>استشارة فردية</option><option>جلسة جماعية</option></select>
                    </div>
                    <div class="input-group">
                        <label>نوع الاستشارة</label>
                        <select>
                            <option>Psychological (نفسية)</option>
                            <option>Social (اجتماعية)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>التاريخ والوقت</label>
                        <input type="datetime-local">
                    </div>
                    <div class="input-group">
                        <label>تحديد القسم الجامعي</label>
                        <input type="text" placeholder="أدخلي كليتكِ">
                    </div>
                    <button class="confirm-btn" onclick="alert('تم إرسال طلب الحجز بنجاح! 🤝')">تأكيد الحجز</button>
                </div>
            </div>
        </div>

        <div id="courses" class="page">
            <div class="section-box">
                <span class="section-title">الدورات المتاحة</span>
                <div class="booking-grid">
                    <div style="background:#f8faff; padding:20px; border-radius:20px; text-align:center;">
                        <h3>إدارة الضغوط</h3>
                        <button class="confirm-btn" style="padding:10px" onclick="alert('تم التسجيل! 🎓')">سجل الآن</button>
                    </div>
                    <div style="background:#f8faff; padding:20px; border-radius:20px; text-align:center;">
                        <h3>مهارات التواصل</h3>
                        <button class="confirm-btn" style="padding:10px" onclick="alert('تم التسجيل! 🎓')">سجل الآن</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        مشروع تخرج - منصة أمانك © 2026 جامعة طيبة 🤝
    </footer>

    <script>
        // دالة تشغيل كل الأزرار والتنقل بين الصفحات
        function showTab(tabId) {
            // إخفاء كل الصفحات
            const pages = document.querySelectorAll('.page');
            pages.forEach(p => p.classList.remove('active'));

            // إظهار الصفحة المطلوبة
            const target = document.getElementById(tabId);
            if(target) {
                target.classList.add('active');
            }
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>
</body>
</html>
